    <title>Raed Alhallaq — Frontend Developer</title>
    <script>
      ;(function () {
        var theme = null
        var lang = null
        try {
          theme = localStorage.getItem('raed_portfolio_theme')
          lang = localStorage.getItem('raed_portfolio_lang')
        } catch (error) {
          theme = null
          lang = null
        }
        if (theme === 'light') {
          document.documentElement.classList.remove('dark')
        } else {
          document.documentElement.classList.add('dark')
        }
        if (lang === 'ar') {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
          document.title = 'رائد الحلاق — مطوّر واجهات أمامية'
        }
      })()
    </script>
